# dsh-qqbot-akane bundle patch（@tencent-connect/dsh-qqbot 0.5.5 的本地 fork）
#
# 当本包通过 `dsh plugin --profile <name> add <本目录路径>` 安装后，
# dsh 启动时自动加载此 patch。
#
# 环境变量：
#   QQBOT_APPID  - QQ Bot AppID（必填）
#   QQBOT_SECRET - QQ Bot AppSecret（必填）
#
# 叠加顺序：dsh-base → 本 bundle patch → profile cordis.patch.yml → --patch

# ── 插入 im-qqbot-akane 插件行 ──
- insert:
    - id: im-qqbot-akane
      name: '@akane/dsh-qqbot'
      config:
        appId: __FROM_ENV__
        appSecret: __FROM_ENV__
        # provider/model 留空：从宿主默认模型路由继承
        # 用户可通过 /model 命令在聊天中切换
        requireMention: true
        # ── 访问控制（R4）──
        # 黑名单优先于 mode 判定：命中的发送者一律零输出 —— 不回复、不解释、
        # 不唤起 agent，即使 @ 了本 bot。这条硬规则写在 prompt 里守不住，落在代码层才站得住。
        # access:
        #   c2cMode: allowlist
        #   c2cAllow: [ '你的 QQ OpenID' ]
        #   c2cDeny: [ '要屏蔽的用户 OpenID' ]
        #   groupMode: allowlist
        #   groupAllow: [ '群 OpenID' ]
        #   groupDeny: [ '要屏蔽的群成员 OpenID' ]
        textChunkLimit: 4500
        sessionIdleTimeout: 1800000
        maxQueue: 20
        processingTimeoutMs: 1800000
        # 10 → 40：隐式唤醒要靠群历史补上下文，缓冲太浅等于没上下文
        historyLimit: 40
        # ── persona（R3）：路径可以是绝对路径、~/ 开头，或相对本包根目录 ──
        # 文件按 mtime 热加载，改完下一条消息生效，不用重启进程；留空 = 不注入
        personaGroupFile: persona/akane-group.md
        personaDirectFile: persona/akane-direct.md
        personaLessonsDir: persona/lessons
        # ── 群聊隐式唤醒（R1）──
        # 强词：独立成词即触发；弱词：需要呼格信号（子句首 / 紧跟称呼标点 / 后接你您能帮在吗…）
        # 排除片段：复合词里的名字不算呼喊。改词表只改这里，不用重新编译。
        wakeWords:
          - akane
          - 茜
          - 茜茜
          - 猫娘
        wakeWordsWeak:
          - 猫
        wakeWordExcludes:
          - 熊猫
          - 猫粮
          - 猫砂
          - 猫咪
          - 摸猫
          - 养猫
          - 猫爪
          - 猫meme
          - 表情包
        debug: false
